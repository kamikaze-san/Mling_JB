# DPO + LoRA repair of CohereLabs/tiny-aya-global (trained on HF BF16 weights,
# deployed as a GGUF LoRA on the official Q4_K_M base).
# Keep EVERYTHING here fixed across ablation conditions; only the condition
# file (which profiles the pairs come from) and the seed change.

base_model: CohereLabs/tiny-aya-global
base_revision: null          # pin to the commit matching the official GGUF release
torch_dtype: bfloat16        # weights dtype on M4 (MPS) / CUDA
mixed_precision: none        # none | bf16 | fp16 (Trainer AMP flag; keep none on MPS)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

dpo:
  beta: 0.1
  loss_type: sigmoid
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 2048
  max_prompt_length: 1536
  gradient_checkpointing: true
  logging_steps: 5

seeds: [0, 1]
